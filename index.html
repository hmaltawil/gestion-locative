<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Security rule: only the app's own scripts run (plus the theme script below, by its hash: update the hash if you
       change that script, a test checks it), and the app only talks to GitHub (backup) and INSEE (rent index). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-0UCDm26du6GB+WHv5fRVBGQN1LmxQkPDoNA5lehQYtA='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://bdm.insee.fr; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gestion locative</title>
  <meta name="description" content="Suivi des loyers, quittances et révisions pour propriétaires bailleurs.">
  <meta name="theme-color" content="#f4f5f7">
  <script>
    // Apply the saved theme before anything is drawn (light by default).
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('gl-theme') || 'light'; } catch (e) {}
      if (t !== 'auto') document.documentElement.setAttribute('data-theme', t);
      if (t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#111317');
      }
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Locatif">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
